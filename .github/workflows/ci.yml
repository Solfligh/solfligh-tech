name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older run, so a PR that gets
# several commits in a row does not queue up stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version configured for the Vercel project, so CI
          # cannot pass on a runtime production does not use.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs first: it is the fastest signal and catches the class of bug that
      # shipped twice before this workflow existed.
      - name: Test
        run: npm test

      # Turbopack skips type validation during build, so this is a separate
      # gate rather than something the build would have caught.
      - name: Typecheck
        run: npx tsc --noEmit

      # No secrets are needed. app/lib/supabaseAdmin.ts initialises lazily, so
      # a build without Supabase credentials succeeds instead of aborting while
      # collecting page data. Keeping it that way is itself worth verifying.
      - name: Build
        run: npm run build
